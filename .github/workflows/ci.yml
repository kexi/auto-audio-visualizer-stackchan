name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

# 同一ブランチの連続 push では古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nix flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Install dependencies from devShell
        run: nix develop --command just setup

      # ローカルとCIで同じflake・同じjust recipeを通す。
      - name: Run all checks
        run: nix develop --command just all

  gpu-test:
    name: GPU parity test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Install dependencies from devShell
        run: nix develop --command just setup

      # devShellのChromiumでCPU/GPU乱数列とGLSL描画の一致を検証する。
      - name: GPU parity test
        run: nix develop --command pnpm test:gpu
