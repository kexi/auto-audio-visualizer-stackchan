[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = platformio/espressif32@7.0.1
board = m5stack-cores3
framework = arduino
lib_deps =
  m5stack/M5Unified@0.2.19
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
build_unflags =
  -std=gnu++11
monitor_speed = 115200
