pre-commit:
  parallel: true
  commands:
    format:
      run: just format-check
    lint:
      run: just lint
    tidy:
      glob: '{.clang-tidy,CMakeLists.txt,stackchan/**/*.{cpp,hpp}}'
      run: just tidy
    actions:
      glob: '.github/workflows/*.{yml,yaml}'
      run: just actions
    secrets:
      run: just secrets-staged
